name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'   # ships npm >= 11.5.1; global npm self-update is broken on current runner images (missing bundled sigstore)
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci
      - name: Gates
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run test:coverage
      - name: Publish (tokenless OIDC, provenance)
        run: npm publish --provenance --access public
